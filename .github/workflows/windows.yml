name: Build Windows
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test, build and package Windows x64
        shell: pwsh
        run: ./Scripts/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: Screen-Scout-Windows-x64
          path: |
            dist/Screen-Scout-Windows-x64.zip
            dist/Screen-Scout-Windows-x64.zip.sha256
          if-no-files-found: error
